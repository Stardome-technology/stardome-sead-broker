# Remote compose file — pulls pre-built images from ghcr.io instead of building.
# Usage: docker compose -f docker-compose.remote.yml up -d

services:
  broker:
    image: ghcr.io/stardome-technology/stardome-sead-broker:latest
    container_name: stardome-sead-broker
    ports:
      - "8088:8088"
    env_file:
      - path: .env
        required: true
    environment:
      - STARDOME_CLIENT_PATH=/opt/stardome/bin/stardome-client
      - STARDOME_PORT=${STARDOME_PORT:-/dev/ttyUSB0}
      - STARDOME_BAUD=${STARDOME_BAUD:-115200}
      - STARDOME_TIMEOUT_MS=${STARDOME_TIMEOUT_MS:-20000}
      - STARDOME_SCHEME=${STARDOME_SCHEME:-v1.0.0_0}
      - SEAD_EDGE_URL=${SEAD_EDGE_URL:?error}
      - SEAD_INGEST_TIMEOUT_SEC=${SEAD_INGEST_TIMEOUT_SEC:-30}
      # Optional CA bundle to trust when SEAD_EDGE_URL is https:// with a
      # self-signed/private CA (gateway single-side TLS). Point at the mounted
      # ca.crt; leave empty to use the system trust store.
      - SEAD_CA_CERT=${SEAD_CA_CERT:-/etc/broker/certs/ca.crt}
      # When SEAD_EDGE_URL points at a gateway (https://<node>:30080, the
      # recommended public path), SEAD_AUTH_SECRET MUST be the same value as the
      # gateway's SEAD_AUTH_SECRET (or one of its GATEWAY_EDGE_TOKENS), because
      # the gateway requires it as `Authorization: Bearer <value>` on /ingest.
      # It is NOT a cross-org token: cross-org access is authorized by the SEAD
      # DAG (org/edge authorization events), not a shared transport secret.
      - SEAD_AUTH_SECRET=${SEAD_AUTH_SECRET:-}
      - EDGE_MODULE_ID=${EDGE_MODULE_ID:?error}
      - EDGE_ID=${EDGE_ID:?error}
      - EDGE_ORG_ID=${EDGE_ORG_ID:?error}
      - GEN_TOKEN_PATH=${GEN_TOKEN_PATH:-}
      - EDGE_ORG_SIGNING_KEY=${EDGE_ORG_SIGNING_KEY:-}
      - EDGE_ORG_PUBLIC_KEY=${EDGE_ORG_PUBLIC_KEY:-}
      - EDGE_TOKEN_TTL=${EDGE_TOKEN_TTL:-300}
      - GEN_TOKEN_TIMEOUT_SEC=${GEN_TOKEN_TIMEOUT_SEC:-1800}
    volumes:
      # Mount the serial device for hardware access
      - ${STARDOME_PORT:-/dev/ttyUSB0}:${STARDOME_PORT:-/dev/ttyUSB0}
      # Mount the stardome-client binary from the host path into the container.
      # STARDOME_CLIENT_PATH in .env should be the host path to the binary FILE.
      - ${STARDOME_CLIENT_PATH:-/dev/null}:/opt/stardome/bin/stardome-client
      # Mount payloads and signatures directories for the broker to access.
      # The broker passes these paths directly to stardome-client.
      - ${PAYLOADS_DIR:-/home/ubuntu/payloads}:/data/payloads
      - ${SIGNATURES_DIR:-/home/ubuntu/signatures}:/data/signatures
      # Mount the CA bundle the broker trusts for the gateway's self-signed TLS.
      - ./certs:/etc/broker/certs:ro
    devices:
      - ${STARDOME_PORT:-/dev/ttyUSB0}:${STARDOME_PORT:-/dev/ttyUSB0}
    # Required so the container can reach the host's edge-service via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on — the broker connects to edge-service via SEAD_EDGE_URL,
    # which is typically https://host.docker.internal:30080 (same host, via extra_hosts).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sead-network

networks:
  sead-network:
    name: sead-network
    external: true